[project]
name = "mark-ledger"
version = "0.1.0"
description = "Append-only, hash-chained, externally anchored evidence ledger with provenance; signed run manifests under the mark key hierarchy."
requires-python = ">=3.12"
dependencies = [
  # 46.0.3 is the last release with a win_arm64 wheel (the authoring laptop); the pod (x86_64) takes the current line.
  "cryptography==46.0.3; sys_platform == 'win32' and platform_machine == 'ARM64'",
  "cryptography>=46.0.7,<50; sys_platform != 'win32' or platform_machine != 'ARM64'",
  "httpx>=0.27",
]

[project.scripts]
mark-ledger = "mark_ledger.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mark_ledger"]
