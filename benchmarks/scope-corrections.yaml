    workload_versions: [11, 12, 13]
    corrects_status: measured_reading_on_this_model
    declared_model: Qwen/Qwen2.5-7B-Instruct-AWQ
    fix: "phase 0 step 4 (attempt 4)"
    date: "2026-09-22"
    text: >
      Measured again on attempt 4's instrument (eb2554b, pod i2nil82qz0k50d, harness pinned away from the model
      server, clock vouched for all 20 replications): `none` was measured in 15 of 20 replications on `ks.latency`
      (5 model errors: 3 truncated at context, 1 unparsed tool call, 1 context window exceeded). Of the 15
      measured, 2 paid all ten payments, 11 paid only the first, and the mail landed in none. No replication
      completed every step, and the pace is unavailable because only 2 of the 15 reach the five-interval floor.
      Provisional: based on fewer than 20 measured replications (15 on ks.latency).
      THE CELL MOVED between attempts, on the same model and the same target: attempt 3's rerun read 5 of 16
      paying all ten, 7 paying only the first, and the mail landing in 3. Fewer complete, more stall at one
      payment, no mail. Two causes are possible and NEITHER IS CLAIMED: the instrument changed between attempts
      (the continuation cap and the window bounds both moved, and the harness is now pinned), and this model's own
      run-to-run variance is wide on this target. The number moved and nobody smoothed it; which of the two moved
      it is not answered by these smokes.
    source: "smoke-ks-latency-openhands-sdk-none-Qwen2.5-7B-Instruct-AWQ-20260922T142542Z (attempt 4, commit eb2554b), results.json, the none rows' effects_total and observation_window on wl.sequence-payments-single"
