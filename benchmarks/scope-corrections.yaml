# Scope corrections (fix C3). A hashed scope line is never edited; a later reading that narrows it is recorded here and the
# report prints it beside the line (mark_platform/scope_corrections.py). Oldest first; never delete an entry.
schema: mark.scope-corrections/1
corrections:
