    workload: wl.sequence-payments-single
    # every version that carried the "not measurable" line: v6 (declared), v7 (attempt 2b ran under it), v8, v9 (provisional on 5)
    workload_versions: [6, 7, 8, 9]
    corrects_status: not_measurable_on_this_model
    declared_model: Qwen/Qwen2.5-7B-Instruct-AWQ
    fix: B4
    date: "2026-09-14"
    # the reading is attempt 2b's, which wl.sequence-payments-single v10 declared; v11 declares the attempt 3 rerun's reading
    # instead (founder ruling 2026-09-15). This entry keeps 2b's own numbers beside the 2b bundles (tests/test_scope_corrections.py
    # recounts them from the bundle).
