# Builds the platform-runtime image (packages/platform/pod/Dockerfile) for linux/amd64 and pushes it to GHCR,
# so a pod can be created from a DIGEST and the run manifest's image_digest is a pin, not "unknown".
# Public package on purpose: the image holds the pinned base, apt packages, the collector and Tempo binaries and
# setup.sh; no repo code, no model, no key. Trigger: manual, or a change to the pod directory.
name: platform-image
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["packages/platform/pod/Dockerfile", "packages/platform/pod/setup.sh", ".github/workflows/platform-image.yml"]
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The CUDA base is ~20 GB unpacked; a stock runner has ~14 GB free and died mid-build without a log
      # (runs 34655355209 and 34655801794, 2026-09-11). Drop the preinstalled toolchains first.
      - name: free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af > /dev/null 2>&1 || true
          df -h / | tail -1
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: packages/platform
          file: packages/platform/pod/Dockerfile
          platforms: linux/amd64
          push: true
          # No provenance or SBOM attestation (2026-09-12): buildx's default provenance embeds the whole GitHub push
          # event in a public blob next to the image (author and pusher emails, the private repo's name, id and
          # description, the commit message, the Actions run). The image pins by its platform manifest digest;
          # attestations were never part of the reproducibility anchor.
          provenance: false
          sbom: false
          tags: |
            ghcr.io/${{ github.repository_owner }}/mark-platform-runtime:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/mark-platform-runtime:latest
      - name: record digest
        run: |
          echo "image=ghcr.io/${{ github.repository_owner }}/mark-platform-runtime@${{ steps.build.outputs.digest }}" | tee image-digest.txt
      - uses: actions/upload-artifact@v4
        with:
          name: image-digest
          path: image-digest.txt
