# Target registry (Task 3.1). Every agent, control and reference target the Probe Runtime may launch.
# Rules enforced by packages/platform/tests/test_registry.py:
#   - license is OSI-approved and named by SPDX id; `license_checked` records who checked and when;
#   - repo targets carry a 40-hex `sha` (or `pypi` name+version+sha256 for wheel-only targets);
#   - every target names how it is launched (`launch`), instrumented (`instrumented`) and halted (`halt`);
#   - category is one of agent | control | framework-native-control | reference.
# Terms state, edition and study set (Layer 1 change-set B5, founder rulings 2026-09-15), enforced by the same loader:
#   - study_set is labs | platform_demo. The two sets are disjoint by upstream subject (the repository, else the package), and
#     every run manifest records the assertion (pins.study_sets). All attempt 3 targets are labs.
#   - edition is community | lab_built. A lab_built target is the Lab's own reference implementation (Policy 2.0 §3B and
#     Part IX): its pins name what it is built on (langgraph-ref is a Lab-built agent on the LangGraph library), and it
#     carries no enterprise delta. managed and commercial are refused, because commercial targets are not registered in this
#     pass.
#   - section_26 classifies each open-source (community) subject as Policy 2.0 §26 does at signing:
#     - open_source_edition_of_commercial_product: LangGraph's interrupt, OpenHands' pause, and the Agent Governance
#       Toolkit until shown otherwise. Publishing a result on it needs bound media liability coverage.
#     - open_source_subject: no commercial form from the same vendor.
#     - not_classified_at_signing: the policy does not classify it.
#   - An open-source (community) subject carries license_url and license_retrieved_at, and an enterprise_delta_ref into
#     targets/enterprise-deltas.yaml. That delta is what the commercial or managed edition adds, cited from the project's own
#     documentation.
#   - execution_class and publication_class use the Testability Ledger v2 vocabularies.
#   - tag_states records each control-family tag, per entry:
#     - claimed: from the project's own document, to the five-part standard (url, revision, retrieved_at, section, and a
#       quote under fifteen words), plus `evidence`, the preserved copy of that document (the loader refuses a missing file,
#       and a test finds the quote in it);
#     - none_found: names the documents checked;
#     - undetermined: names the missing element.
#     The registry never records a demonstrated state: a run demonstrates it, and the report reads it. The documents cited
#     are preserved byte-exact under targets/evidence/.
# Adding a target = adding an entry here AND an adapter under packages/platform/mark_platform/{targets,controls}/.
schema: mark.target-registry/1

targets:
  # ---- reference (no LLM; the harness's own positive control and calibration vehicle) ----
  - id: scripted
    name: Scripted reference agent
    category: reference
    license: MIT
    license_checked: "in-repo (packages/platform), 2026-09-11"
    repo: null
    sha: null
    study_set: labs
    edition: lab_built
    execution_class: Permitted
    publication_class: Unconditional
    tag_states: []
    launch: { module: mark_platform.targets.scripted }
    instrumented: "every tool call is a span; tool calls go to the mock world with the scenario baggage"
    halt: "checks the in-process stop flag between tool calls; batch tools honour cancel_inflight"
    notes: "Executes the workload's tool script verbatim. Proves the pipeline (halt, telemetry, ledger) without a model. Never counts as an agent result."
    finish_tool: null   # founder ruling 2026-09-23: every agent declares how its framework ends a conversation
    finish_tool_note: "No model: the script ends when its last tool call returns (targets/scripted.py), so there is no model turn to end a conversation with."

